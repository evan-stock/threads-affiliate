<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>운영판</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="운영판">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: channel switch on top (오늘의쓸모 yellow / 폴리티커 purple), then one column feed — sticky "next post" bar, then posts grouped by day; tap a post to open slides, slide text and caption. Brand: black + white bold + yellow #FFD84D (same as the cards). */
:root{
  --bg:#0d0d0c; --panel:#171715; --panel2:#201f1c; --line:#2d2c28;
  --fg:#f4f2ea; --muted:#9a978c; --accent:#FFD84D; --accent-ink:#1a1600;
  --ok:#5fd28a; --warn:#ffb547; --bad:#ff6b5e; --info:#7cb8ff;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
body[data-ch="politea"]{--accent:#9F7BFF;--accent-ink:#140a33}
*{box-sizing:border-box}
.plat{display:flex;margin-top:14px;border-bottom:1px solid var(--line)}
.pl{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:14.5px;padding:10px 2px 11px;flex-direction:column;align-items:center;gap:0;line-height:1.3;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;display:flex;gap:7px;justify-content:center;align-items:baseline}
.pl small{font-family:var(--f-num);font-weight:500;font-size:11px;color:var(--muted)}
.pl small.hot{color:var(--warn)}
.pl[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.pl:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.chan[hidden]{display:none}
.chan{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;padding:4px;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.ch{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:15px;padding:10px 8px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25}
.ch small{font-family:var(--f-num);font-weight:500;font-size:11px;letter-spacing:.08em}
.ch[aria-selected="true"]{color:var(--ch-ink);background:var(--ch-bg)}
.ch:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ch .dotn{font-family:var(--f-num);font-size:11px;font-weight:600;opacity:.8}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:22px 6px;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--f-num);font-size:12px;letter-spacing:.14em;color:var(--muted)}
.brand b{color:var(--accent);font-weight:600}
h1{font-size:24px;line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
.asof{font-size:12.5px;color:var(--muted)}

.next{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px}
.next-in{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.next-in img{width:54px;height:68px;object-fit:cover;border-radius:6px;flex:none;background:#0003}
.next-txt{min-width:0;flex:1}
.next-k{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.75}
.next-t{font-weight:700;font-size:16px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.next-when{font-family:var(--f-num);font-weight:600;font-size:20px;text-align:right;flex:none;font-variant-numeric:tabular-nums;line-height:1.15}
.next-when small{display:block;font-size:12px;font-family:var(--f-body);font-weight:500;opacity:.75}

.counts{display:flex;flex-wrap:wrap;gap:8px;padding-block:6px 4px}
.tab{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:13.5px;
  padding:7px 13px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab span{font-family:var(--f-num);color:var(--muted);font-size:12.5px}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-pressed="true"] span{color:var(--bg);opacity:.7}
.tab:focus-visible,.post-head:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.day{margin-top:22px}
.day h2{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.day h2 em{font-style:normal;color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}

.post{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.post.dim{opacity:.55}
.post-head{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:12px;cursor:pointer;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit}
.cov{width:84px;aspect-ratio:4/5;border-radius:8px;object-fit:cover;background:var(--panel2);display:block}
.cov.reel{aspect-ratio:9/16;width:68px}
.meta{min-width:0;display:flex;flex-direction:column;gap:5px}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time{font-family:var(--f-num);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.s-approved{color:var(--info)} .s-published{color:var(--ok)} .s-held{color:var(--warn)} .s-rejected{color:var(--muted)}
.s-draft{color:var(--accent)} .s-late{color:var(--bad)} .s-other{color:var(--muted)}
.fmt{font-size:11.5px;color:var(--muted);font-weight:500}
.ctitle{font-weight:700;font-size:15.5px;line-height:1.38;white-space:pre-line;word-break:keep-all}
.ctitle q{quotes:none;color:var(--accent)}
.topic{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.note{font-size:12.5px;color:var(--warn)}

.detail{border-top:1px solid var(--line);padding:14px 12px 16px;display:flex;flex-direction:column;gap:16px}
.detail h3{margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:.08em;font-weight:700}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.strip figure{margin:0;flex:none;width:118px;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px}
.strip img{width:118px;aspect-ratio:4/5;object-fit:cover;border-radius:6px;background:var(--panel2)}
.strip figcaption{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.reelcov{width:220px;background:#000;max-width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px}
ol.slides{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
ol.slides li{display:grid;grid-template-columns:28px 1fr;gap:8px;counter-increment:s}
ol.slides li::before{content:counter(s);font-family:var(--f-num);font-size:12px;color:var(--accent);padding-top:2px}
.sl-t{font-weight:700;white-space:pre-line;word-break:keep-all}
.sl-sub{font-size:13px;color:var(--accent)}
.sl-b{font-size:13.5px;color:#cfccc1;white-space:pre-line}
.vid{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:500}
.cap{background:var(--panel2);border-radius:10px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;color:#dedbd0}
.caphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.caphead h3{margin:0}
.copy{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:12.5px;padding:5px 11px;border-radius:8px;cursor:pointer}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.links a{color:var(--accent)}
.song-line{font-size:12.5px;color:var(--accent);display:flex;gap:6px;align-items:baseline;min-width:0}
.song-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-line.none{color:var(--muted)}
.songs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.songs li{background:var(--panel2);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
.songs li.pick{outline:1px solid var(--accent)}
.sg-t{font-weight:700;font-size:14px;min-width:0}
.sg-t small{font-weight:500;color:var(--muted);font-size:12.5px}
.sg-pick{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.sg-d{grid-column:1;font-size:12.5px;color:#cfccc1}
.sg-c{grid-row:1/3;grid-column:2;align-self:center}
.sg-note{font-size:12px;color:var(--muted)}
.refresh{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.refresh:disabled{opacity:.6;cursor:default}
.refresh:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.asof-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rmsg{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.srcs{margin:0;padding:0 0 0 18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.srcs a{color:var(--accent);word-break:break-all}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;color:#cfccc1;background:var(--panel2);border-radius:999px;padding:2px 9px}
.post-head.nocov{grid-template-columns:1fr}
.replies{margin:0;padding:0 0 0 18px;font-size:13.5px;color:#dedbd0;display:flex;flex-direction:column;gap:6px;white-space:pre-wrap}
.ov-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ov-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.ov-stat b{display:block;font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.ov-stat span{font-size:12.5px;color:var(--muted)}
.ov-stat.warn b{color:var(--warn)} .ov-stat.bad b{color:var(--bad)} .ov-stat.ok b{color:var(--ok)}
.ov-h{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:26px 0 10px;display:flex;gap:8px;align-items:baseline}
.ov-h span{font-family:var(--f-num);font-weight:500}
.todo{display:flex;flex-direction:column;gap:8px}
.ti{width:100%;text-align:left;color:inherit;cursor:pointer;position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--k);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.ti:focus-visible,.tile:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ti .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.ti .kind{font-weight:700;color:var(--k)}
.ti .chn{color:var(--muted)}
.ti .ago{margin-left:auto;font-family:var(--f-num);color:var(--muted)}
.ti .tt{font-weight:700;font-size:15px;line-height:1.38;word-break:keep-all}
.ti .mm{font-size:13px;color:#cfccc1}
.ti .ack{align-self:flex-start;margin-top:6px;appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:12.5px;padding:5px 11px;border-radius:8px;cursor:pointer}
.ti .ack:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ackline{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ackline button{appearance:none;border:0;background:none;color:var(--fg);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.k-fail{--k:var(--bad)} .k-late{--k:var(--bad)} .k-approve{--k:var(--warn)} .k-held{--k:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .tn{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.tile .tn i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tile .tc{display:flex;gap:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.tile .tc b{font-family:var(--f-num);font-weight:600;color:var(--fg)}
.tile .tc b.w{color:var(--warn)} .tile .tc b.x{color:var(--bad)}
.tile .tx{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rw{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px;color:inherit;text-decoration:none}
.rw:first-child{border-top:0}
.rw .t{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.rw .c{font-size:12px;color:var(--muted);white-space:nowrap}
.rw .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
a.rw .x{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.none{color:var(--muted);font-size:13.5px;padding:4px 2px}
.recsel{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.rec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.rec-h{appearance:none;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rec-h:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.rec-h .r1{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.rec-h .r1 b{color:var(--fg);font-size:14.5px}
.rec-h .r1 i{font-style:normal;width:8px;height:8px;border-radius:50%;background:var(--c)}
.rec-top{font-size:13.5px;color:#dedbd0;white-space:pre-wrap;line-height:1.55}
.md{border-top:1px solid var(--line);padding:6px 14px 16px;font-size:14px;line-height:1.65;color:#e6e3d8;word-break:break-word}
.md h1,.md h2,.md h3,.md h4{font-size:15px;margin:18px 0 6px;color:var(--fg);line-height:1.4}
.md h1,.md h2{font-size:16px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:20px}
.md li{margin:3px 0}
.md a{color:var(--accent);word-break:break-all}
.md code{font-family:var(--f-num);font-size:12.5px;background:var(--panel2);padding:1px 4px;border-radius:4px}
.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.md blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}
.md table{border-collapse:collapse;font-size:12.5px;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--line);padding:4px 6px;text-align:left}
.recnote{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;cursor:pointer;appearance:none;width:100%;text-align:left;font:inherit;color:inherit}
.recnote small{color:var(--muted);font-size:12px}
footer{margin-top:36px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html,body{margin:0}
body{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.apv{display:flex;gap:8px;padding:0 12px 12px}
.ti .apv{padding:6px 0 0}
.apv button{appearance:none;flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:14px;font-weight:700;padding:9px 10px;border-radius:10px;cursor:pointer}
.apv button[data-act="ok"]{border-color:#2f6b45;background:#173322}
.apv button[data-act="no"]{color:#e6b3ad}
.apv button.armed{outline:2px solid var(--warn);outline-offset:1px}
.apv button:disabled{opacity:.6;cursor:default}
.apv button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.mnl{display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
.mnl button{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:13px;padding:7px 11px;border-radius:9px;cursor:pointer}
.mnl input{flex:1 1 200px;min-width:0;font:inherit;font-size:13.5px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.apv-msg{font-size:12.5px;color:var(--muted);padding:0 12px 10px}
.ti .apv-msg{padding:4px 0 0}
.gate{max-width:520px;margin:40px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.gate h2{margin:0;font-size:19px}
.gate ol{margin:0;padding-left:20px;font-size:14px;line-height:1.7;color:#dedbd0}
.gate a{color:var(--accent)}
.gate input{font:inherit;font-size:15px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);width:100%}
.gate button{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:15px;padding:11px;border-radius:10px;cursor:pointer}
.gate .err{color:var(--bad);font-size:13px}
.gate small{color:var(--muted);font-size:12.5px;line-height:1.6}
.linkbtn{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
</style>
</head>
<body>

<div class="wrap">
  <nav class="plat" id="plat" role="tablist" aria-label="플랫폼">
    <button class="pl" id="pl-home" data-pl="home" role="tab" aria-selected="true">한눈에<small></small></button>
    <button class="pl" id="pl-insta" data-pl="insta" role="tab" aria-selected="false">인스타<small></small></button>
    <button class="pl" id="pl-yt" data-pl="yt" role="tab" aria-selected="false">유튜브<small></small></button>
    <button class="pl" id="pl-th" data-pl="th" role="tab" aria-selected="false">스레드<small></small></button>
    <button class="pl" id="pl-rec" data-pl="rec" role="tab" aria-selected="false">추천<small></small></button>
  </nav>
  <nav class="chan" id="chan" role="tablist" aria-label="채널"></nav>

function mdToHtml(src){
  const esc = t => String(t||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const out = []; let list = null, para = [], table = null;
  const flushP = () => { if (para.length){ out.push('<p>'+para.map(inline).join('<br>')+'</p>'); para=[]; } };
  const flushL = () => { if (list){ out.push(`<${list.t}>`+list.items.map(i=>'<li>'+inline(i)+'</li>').join('')+`</${list.t}>`); list=null; } };
  const flushT = () => { if (table){ out.push('<table>'+table.map((r,i)=>'<tr>'+r.map(c=>i===0?'<th>'+inline(c)+'</th>':'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</table>'); table=null; } };
  for (const raw of String(src||'').split('\n')){
    const line = raw.replace(/\s+$/,'');
    let m;
    if (/^\s*\|.*\|\s*$/.test(line)){ flushP(); flushL(); if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) continue; (table=table||[]).push(line.trim().slice(1,-1).split('|').map(c=>c.trim())); continue; }
    flushT();
    if (!line.trim()){ flushP(); flushL(); continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)/))){ flushP(); flushL(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)){ flushP(); flushL(); out.push('<hr>'); continue; }
    if ((m = line.match(/^>\s?(.*)/))){ flushP(); flushL(); out.push('<blockquote>'+inline(m[1])+'</blockquote>'); continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))){ flushP(); if(!list||list.t!=='ul'){ flushL(); list={t:'ul',items:[]}; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))){ flushP(); if(!list||list.t!=='ol'){ flushL(); list={t:'ol',items:[]}; } list.items.push(m[1]); continue; }
    if (list && /^\s{2,}\S/.test(raw)){ list.items[list.items.length-1] += ' ' + line.trim(); continue; }
    flushL(); para.push(line);
  }
  flushP(); flushL(); flushT();
  return out.join('');
}

const OWNER = 'evan-stock';
const GH = 'https://api.github.com';
const REPO_OF = {worthy:'cardnews', ytworthy:'cardnews', ytfur:'cardnews', ytlife:'cardnews', politea:'politea', kk:'humor-cards'};
let TOKEN = ''; try { TOKEN = localStorage.getItem('gh_token') || ''; } catch(e){}
let LAST_LOAD = 0, LOADING = false;
const RAW = (repo, path) => `https://raw.githubusercontent.com/${OWNER}/${repo}/main/` + String(path).split('/').map(encodeURIComponent).join('/');
const isImg = f => /\.(jpe?g|png|webp)$/i.test(f||'');
function nt(v){ if (!v) return v || null; let s = String(v).replace(/(\.\d{3})\d+/, '$1'); if (/T\d/.test(s) && !/(Z|[+-]\d\d:?\d\d)$/.test(s)) s += '+09:00'; return s; }
function tms(v){ const t = Date.parse(nt(v)); return isNaN(t) ? null : t; }
function kstParts(ms){ const p = {}; new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value); if (p.hour==='24') p.hour='00'; return p; }
function kstIso(ms){ const p = kstParts(ms==null?Date.now():ms); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}+09:00`; }
function kstDay(ms){ const p = kstParts(ms); return `${p.year}-${p.month}-${p.day}`; }
function since(){ return Date.parse(kstDay(Date.now()-2*864e5)+'T00:00:00+09:00'); }

// ---- GitHub 호출 ----
async function gh(path, opt){
  opt = opt || {};
  const r = await fetch(GH + path, Object.assign({}, opt, {cache:'no-store', headers: Object.assign({'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}, opt.headers||{})}));
  if (!r.ok){ const t = await r.text(); const e = new Error(r.status + ' ' + t.slice(0,160)); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
async function gql(query){
  const r = await fetch(GH + '/graphql', {method:'POST', cache:'no-store', headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'}, body: JSON.stringify({query})});
  if (r.status === 401) { const e = new Error('열쇠가 맞지 않거나 만료됐습니다.'); e.status = 401; throw e; }
  const j = await r.json();
  if (j.errors && j.errors.length) throw new Error(j.errors[0].message);
  return j.data;
}
const Q = `{
 cn: repository(owner:"${OWNER}", name:"cardnews"){ ...P }
 pt: repository(owner:"${OWNER}", name:"politea"){ ...P }
 ta: repository(owner:"${OWNER}", name:"threads-affiliate"){ ...P dash: object(expression:"HEAD:state/dashboard.json"){ ... on Blob { text } } songs: object(expression:"HEAD:ops/songs.json"){ ... on Blob { text } } songsPt: object(expression:"HEAD:ops/songs_politea.json"){ ... on Blob { text } } recs: object(expression:"HEAD:ops/recs"){ ... on Tree { entries { name object { ... on Blob { text } } } } } }
}
fragment P on Repository { posts: object(expression:"HEAD:state/posts"){ ... on Tree { entries { name object { ... on Blob { text } } } } } }`;
function parsePosts(repoNode){
  const out = [];
  const ents = (repoNode && repoNode.posts && repoNode.posts.entries) || [];
  for (const e of ents){ if (!/\.json$/.test(e.name) || !e.object || e.object.text == null) continue; try { out.push(JSON.parse(e.object.text)); } catch(_){} }
  return out;
}

function buildInsta(d, repo){
  const isReel = d.format === 'reel', files = d.files || [];
  let cover = null;
  if (isReel){
    let cv = d.cover;
    if (cv && typeof cv === 'object'){ const img = cv.img || ''; cv = img ? (img.indexOf('/') >= 0 ? img : `media/${d.id}/${img}`) : null; }
    if (typeof cv !== 'string') cv = null;
    cover = RAW(repo, cv || `media/${d.id}/reel_cover.jpg`);
  } else if (files.length && isImg(files[0])) cover = RAW(repo, files[0]);
  const slides = d.slides || [];
  return {
    id: d.id, source: 'state', format: isReel ? 'reel' : 'carousel', status: d.status || 'unknown',
    publish_at: nt(d.publish_at), published_at: nt(d.published_at),
    slot_label: d.slot_label || ({lunch:'점심', evening:'저녁'})[d.slot] || '',
    topic: d.topic || '', category: d.category || '',
    cover_title: isReel ? (d.cover_text || d.title || '') : (slides[0] ? slides[0].t || '' : ''),
    slides: slides.map(x => ({t: x.t||'', sub: x.sub||'', b: x.b||'', video: !!x.video})),
    caption: d.caption_full || '', permalink: d.permalink || d.reel_permalink || null,
    note: d.held_note || d.note || d.error || '', cover, slide_imgs: isReel ? [] : files.map(f => isImg(f) ? RAW(repo, f) : null),
    music: null, created_at: nt(d.created_at)
  };
}

function plainErr(e){ e = String(e || ''); if (e.indexOf('request limit') >= 0) return '인스타 API 요청 한도 초과'; if (e.indexOf('2207051') >= 0) return '인스타 활동 제한(스팸 의심)'; return e.slice(0,70); }
const NAMES = {worthy:'인스타 쓸모', politea:'인스타 폴리티커', kk:'인스타 ㅋㅋ상회', ytworthy:'유튜브 쓸모', ytfur:'유튜브 털뭉치', ytlife:'유튜브 인생댓글', thA:'스레드 득템', thB:'스레드 찬복'};
function buildOV(cn, pt, th, hk){
  const now = Date.now(), recs = [];
  const firstLine = s => String(s || '').replace(/\n/g, ' ').trim().slice(0,60);
  const add = (ch, d, title, err) => recs.push({ch, id: d.id, status: d.status || '', title: firstLine(title),
    publish_at: nt(d.publish_at || d.scheduled_at), published_at: nt(d.published_at) || null, created_at: nt(d.created_at),
    url: d.permalink || d.reel_permalink || null, err: err || d.error || d.held_note || d.note || ''});
  for (const [arr, insta] of [[cn,'worthy'],[pt,'politea']]){
    for (const d of arr){
      if (d.kind === 'short'){ const yt = (d.yt && typeof d.yt === 'object') ? d.yt : {};
        add(({shop:'ytworthy', life:'ytlife'})[yt.channel] || 'ytfur', d, String(yt.title || d.topic || '').replace('#shorts',''));
      } else { const sl = d.slides || []; add(insta, d, (d.format === 'reel' ? d.cover_text : (sl[0] && sl[0].t)) || d.topic || ''); }
    }
  }
  th.forEach(p => add('th' + (p.th_account || 'A'), p, p.cover_title, p.note));
  (hk || []).forEach(p => add('kk', p, p.cover_title, p.error || ''));
  const todo = [], today = [], upcoming = [], tkey = kstDay(now);
  for (const r of recs){
    const st = r.status, ref = tms(r.published_at) || tms(r.publish_at) || tms(r.created_at), pa = tms(r.publish_at);
    const base = {ch: r.ch, id: r.id, title: r.title, url: r.url};
    if (st === 'pending'){ const sn = tms(r.created_at) || pa; todo.push(Object.assign({}, base, {kind:'approve', t: sn ? kstIso(sn) : null, msg: 'GitHub 열쇠로 바로 승인하거나 텔레그램에서'})); }
    else if (st === 'failed' && ref && now - ref < 48*36e5) todo.push(Object.assign({}, base, {kind:'fail', t: kstIso(ref), msg: plainErr(r.err) || '실패'}));
    else if (st === 'held' && ref && now - ref < 72*36e5) todo.push(Object.assign({}, base, {kind:'held', t: kstIso(ref), msg: String(r.err || '').slice(0,70) || '보류 중'}));
    else if ((st === 'approved' || st === 'draft_queued') && pa && pa < now - 15*6e4) todo.push(Object.assign({}, base, {kind:'late', t: kstIso(pa), msg: '예약 시각이 지났는데 아직 안 올라감' + (r.err ? ' · ' + plainErr(r.err) : '')}));
    if (st === 'published'){ const ptm = tms(r.published_at) || pa; if (ptm && kstDay(ptm) === tkey) today.push(Object.assign({}, base, {t: kstIso(ptm)})); }
    if (st === 'approved' && pa && pa >= now - 15*6e4) upcoming.push(Object.assign({}, base, {t: kstIso(pa)}));
  }
  const order = {fail:0, late:1, approve:2, held:3};
  todo.sort((a,b) => order[a.kind]-order[b.kind] || String(a.t||'').localeCompare(String(b.t||'')));
  today.sort((a,b) => String(b.t).localeCompare(String(a.t)));
  upcoming.sort((a,b) => String(a.t).localeCompare(String(b.t)));
  const channels = Object.keys(NAMES).map(k => ({key:k, name:NAMES[k], approve:0, problem:0, today: today.filter(x=>x.ch===k).length, next: upcoming.find(x=>x.ch===k) || null}));
  return {generated_at: kstIso(now), names: NAMES, todo, today, upcoming: upcoming.slice(0,8), channels, extra: {}};
}

const QH = `{ hc: repository(owner:"${OWNER}", name:"humor-cards"){ jobs: object(expression:"HEAD:jobs"){ ... on Tree { entries { name object { ... on Tree { entries { name object { ... on Blob { text } ... on Tree { entries { name } } } } } } } } } } }`;
let HK_ERR = '';
function buildHumor(d){
  const out = [];
  const ents = (d && d.hc && d.hc.jobs && d.hc.jobs.entries) || [];
  for (const j of ents){
    const files = {}, kids = (j.object && j.object.entries) || [];
    kids.forEach(k => files[k.name] = k.object || {});
    if (!files['post.json'] || files['post.json'].text == null) continue;
    const js = n => { try { return files[n] && files[n].text != null ? JSON.parse(files[n].text) : null; } catch(_){ return null; } };
    const post = js('post.json') || {}, pub = js('published.json'), err = js('publish_error.json'), spec = js('spec.json') || {};
    const id = j.name, day = (id.match(/^\d{4}-\d{2}-\d{2}/) || [''])[0];
    const outs = ((files.out && files.out.entries) || []).map(e => e.name).filter(n => /^\d\d\.jpg$/.test(n)).sort().map(n => 'out/' + n);
    const imgs = (post.files && post.files.length ? post.files : outs).map(f => RAW('humor-cards', `jobs/${id}/${f}`));
    const pa = post.publish_at && post.publish_at !== 'now' ? nt(post.publish_at) : null;
    const status = pub ? 'published' : post.rejected ? 'rejected' : err ? 'failed' : post.approved ? 'approved' : 'pending';
    const sl = spec.slides || [], cov = sl.find(x => x.type === 'cover') || {};
    const cap = post.caption || '';
    out.push({ id, source: 'humor', format: 'carousel', status,
      publish_at: nt(pub && pub.published_at) || pa || (day ? day + 'T12:00:00+09:00' : null),
      published_at: nt(pub && pub.published_at) || null, created_at: day ? day + 'T00:00:00+09:00' : null,
      slot_label: '', topic: cap.split('\n')[0].slice(0,60), category: '',
      cover_title: String(cov.title || cap.split('\n')[0] || id).replace(/\n/g, ' '),
      slides: sl.map(x => x.type === 'cover' ? {t: String(x.title||'').replace(/\n/g,' '), sub:'', b:''} : {t: x.headline || '', sub:'', b: (x.paras||[]).map(p => p.text).join('\n\n')}),
      caption: cap, permalink: (pub && pub.permalink) || null,
      note: err ? '게시 실패: ' + String(err.error || '').slice(0,90) : status === 'approved' && !pa ? '승인됨 · 곧 게시' : '',
      error: err ? err.error : '', cover: imgs[0] || null, slide_imgs: imgs, music: null });
  }

}
async function decideHumor(id, act){
  const path = `/repos/${OWNER}/humor-cards/contents/jobs/${encodeURIComponent(id)}/post.json`;
  for (let attempt = 0; attempt < 3; attempt++){
    const f = await gh(path + '?ref=main');
    const post = JSON.parse(b64dec(f.content));
    if (post.approved || post.rejected) return {ok:false, msg:'이미 처리된 게시물이에요.'};
    const stamp = kstIso().slice(0,16).replace('T',' ') + ' KST 운영판 앱 ';
    if (act === 'ok'){ post.approved = true; post.approved_note = stamp + '승인'; }
    else { post.rejected = true; post.rejected_note = stamp + '거절'; }
    try {
      await gh(path, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
        message: `운영판 앱에서 ${act === 'ok' ? '승인' : '거절'}: ${id}`, content: b64enc(JSON.stringify(post, null, 1)), sha: f.sha, branch: 'main'})});
    } catch (e){ if (e.status === 409 || e.status === 422) continue; throw e; }
    if (act !== 'ok') return {ok:true, msg:'거절 반영됨.'};
    const later = post.publish_at && post.publish_at !== 'now' && Date.parse(post.publish_at) > Date.now();
    return {ok:true, msg: later ? '승인 반영됨 · 예약 시각에 게시돼요(30분 단위 확인).' : '승인 반영됨 · 1~2분 안에 인스타에 게시돼요.'};
  }
  return {ok:false, msg:'동시에 다른 변경이 있어 반영하지 못했어요. 잠시 뒤 다시 눌러 주세요.'};
}

function b64dec(s){ const bin = atob(String(s).replace(/\s/g,'')); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }

  const id = bar.dataset.id, repo = bar.dataset.repo;
  try { const r = repo === 'humor-cards' ? await decideHumor(id, act) : await decide(repo, id, act); PENDING_ACT[id] = (r.ok ? '✔ ' : '⚠️ ') + r.msg; }
  catch (err){ PENDING_ACT[id] = '⚠️ 실패: ' + (err.status === 403 || err.status === 404 ? '열쇠에 쓰기 권한이 없어요(Contents 읽기·쓰기 필요).' : String(err.message || err).slice(0,100)); }
  const y = window.scrollY; boot(CUR); window.scrollTo(0, y);
  setTimeout(() => loadAll(false), 2500);
}, true);

// ---- 이미지 대체·열쇠 화면·자동 새로고침 ----
document.addEventListener('error', e => { const t = e.target; if (!t || t.tagName !== 'IMG') return; if (t.dataset.alt){ const a = t.dataset.alt; delete t.dataset.alt; t.src = a; } else t.style.visibility = 'hidden'; }, true);
function showGate(err){
  document.getElementById('plat').hidden = true; document.getElementById('chan').hidden = true;
  document.querySelector('header').hidden = true; document.getElementById('next').hidden = true; document.getElementById('tabs').innerHTML = '';
  document.getElementById('feed').innerHTML = `<div class="gate">
    <h2>GitHub 열쇠 넣기 (처음 한 번)</h2>
    <ol>
      <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 새 열쇠 만들기</a>를 엽니다(로그인 필요).</li>
      <li>이름: <b>운영판 앱</b>, 만료: 1년, Resource owner: <b>evan-stock</b></li>
      <li>Repository access → <b>Only select repositories</b> → cardnews, politea, threads-affiliate, humor-cards</li>
      <li>Permissions → Repository permissions → <b>Contents: Read and write</b>, <b>Actions: Read and write</b></li>
      <li>Generate token → 나온 github_pat_… 를 복사해 아래에 붙여 넣기</li>
    </ol>
    <input id="tok" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="GitHub 열쇠">
    <button id="tokSave" type="button">저장하고 열기</button>
    ${err ? `<div class="err">${err}</div>` : ''}
    <small>열쇠는 이 기기 안에만 저장되고 GitHub에만 보냅니다. 휴대폰을 잃어버리면 GitHub 설정 → Personal access tokens 에서 이 열쇠를 지우면 됩니다. 아이폰은 '홈 화면에 추가'로 연 앱 안에서 넣어야 앱에 저장됩니다.</small>
  </div>`;
  document.getElementById('tokSave').onclick = async () => {
    const v = document.getElementById('tok').value.trim(); if (!v) return;
    TOKEN = v; try { localStorage.setItem('gh_token', v); } catch(_){}
    document.getElementById('plat').hidden = false; document.querySelector('header').hidden = false;
    boot(CUR); loadAll(true);
  };
}
document.getElementById('resetkey').addEventListener('click', () => { try { localStorage.removeItem('gh_token'); } catch(_){} TOKEN = ''; showGate(); });
setInterval(() => { if (document.visibilityState === 'visible' && Date.now() - LAST_LOAD > 60000) loadAll(false); }, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - LAST_LOAD > 20000) loadAll(false); });
if (TOKEN){ platCounts(); boot(CUR); loadAll(false); } else showGate();

</script>
</body>
